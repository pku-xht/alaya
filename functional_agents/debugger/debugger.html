<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Log Debugger</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
body { margin: 0; }
[hidden] { display: none !important; }
/* Layout: a debugger. On the left the tree of every entry of every branch; in the middle the
   log of one branch; on the right what the selected entry means. */
:root {
  --bg: #eef0f3; --panel: #ffffff; --ink: #1f2328; --mute: #66707c; --line: #d6dbe1; --soft: #f5f6f8;
  --rail: #c3cbd4; --hash: #8a6d3b;
  --model: #2f5f95; --tool: #33703b; --person: #6f4a9e; --warn: #b8600b;
  --now: #fff1b8; --now-bar: #d99a00;
  --control: #2f5f95; --control-ink: #ffffff; --bad: #b3261e;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14171b; --panel: #1b1f25; --ink: #e4e7eb; --mute: #8e98a4; --line: #2d343d; --soft: #222730;
    --rail: #3a434e; --hash: #d2b37a;
    --model: #8fb9ea; --tool: #8fd098; --person: #c9aef0; --warn: #e8a35c;
    --now: #4b3f10; --now-bar: #e3b021;
    --control: #8fb9ea; --control-ink: #10151b; --bad: #f2867f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14171b; --panel: #1b1f25; --ink: #e4e7eb; --mute: #8e98a4; --line: #2d343d; --soft: #222730;
  --rail: #3a434e; --hash: #d2b37a;
  --model: #8fb9ea; --tool: #8fd098; --person: #c9aef0; --warn: #e8a35c;
  --now: #4b3f10; --now-bar: #e3b021;
  --control: #8fb9ea; --control-ink: #10151b; --bad: #f2867f;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 13px/1.45 var(--sans); padding-inline: 16px; box-sizing: border-box; }
*, *::before, *::after { box-sizing: inherit; }
.app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 10px; padding-block: 12px; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; }
h1 { font-size: 16px; font-weight: 600; margin: 0; }
.lede { color: var(--mute); margin: 0; flex: 1 1 260px; min-width: 0; }
.toolbar { display: flex; flex-wrap: wrap; gap: 6px; }
button { font: 500 12px var(--sans); color: var(--ink); background: var(--panel); border: 1px solid var(--line);
  border-radius: 5px; padding: 5px 9px; cursor: pointer; }
button:hover:not(:disabled) { border-color: var(--control); }
button:disabled { color: var(--mute); cursor: default; opacity: .6; }
button.primary { background: var(--control); color: var(--control-ink); border-color: var(--control); }
button:focus-visible, .row:focus-visible, .node:focus-visible, .frame:focus-visible, input:focus-visible, textarea:focus-visible {
  outline: 2px solid var(--control); outline-offset: 1px; }
kbd { font: 10px var(--mono); color: var(--mute); margin-left: 5px; }
.panes { display: grid; grid-template-columns: 250px minmax(0, 1fr) 370px; gap: 10px; min-height: 0; }
.pane { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; min-height: 0; min-width: 0;
  display: flex; flex-direction: column; }
.pane > h2 { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--mute);
  margin: 0; padding: 8px 12px; border-bottom: 1px solid var(--line); display: flex; gap: 8px; justify-content: space-between; }
.pane > h2 span { text-transform: none; letter-spacing: 0; font-weight: 400; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.scroll { overflow: auto; min-height: 0; flex: 1; }
.hash { font-family: var(--mono); font-size: 12px; color: var(--hash); white-space: nowrap; }

/* An icon for each kind of entry. */
.ic { flex: none; display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 14px; color: var(--mute); }
.i-sample { color: var(--model); }
.i-exec, .i-external, .i-returned { color: var(--tool); }
.i-said, .i-replied, .i-changed, .i-root { color: var(--person); }
.i-failed, .i-error { color: var(--bad); }
.i-stopped { color: var(--warn); }
.i-opened { color: var(--ink); }

/* The tree. A chain grows straight down at the same indentation; a fork is the only thing that
   indents, and only a fork draws a rail, so a line on the left always marks a set of siblings. */
#tree { padding: 8px 8px 30px; }
.kids > .branch { border-left: 2px solid var(--rail); margin-left: 9px; padding-left: 13px; }
.kids { margin-top: 2px; }
/* An elbow from the rail into the entry that starts a branch. */
.branch > .node:first-child::before { content: ''; position: absolute; left: -13px; top: 11px; width: 11px;
  border-top: 2px solid var(--rail); }
.hide { display: none; }
.node { position: relative; display: flex; align-items: center; gap: 4px; width: 100%; padding: 2px 5px; border-radius: 4px;
  cursor: pointer; opacity: .62; }
.node.path { opacity: 1; }
.node:hover { background: var(--soft); opacity: 1; }
.node.on { background: var(--now); opacity: 1; }
.tw { flex: none; display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 14px;
  color: var(--mute); cursor: pointer; }
.tw:hover { color: var(--ink); }
.tw.leaf { color: var(--rail); cursor: default; }
.count { flex: none; color: var(--mute); font-size: 11px; margin-left: 4px; }

/* The log of one branch. */
#log { font: 12.5px/1.5 var(--mono); padding: 4px 0; }
.row { display: grid; grid-template-columns: 12px auto 16px auto minmax(0, 1fr) auto; gap: 6px; align-items: center;
  padding: 2px 10px 2px 4px; border-left: 3px solid transparent; cursor: pointer; }
.row:hover { background: var(--soft); }
.row.now { background: var(--now); border-left-color: var(--now-bar); }
.row.later { opacity: .55; }
.row .mark { color: var(--now-bar); font-size: 10px; }
.row .where { display: flex; align-self: stretch; }
.guide { display: inline-block; width: 12px; align-self: stretch; border-left: 1px solid var(--line); margin-left: 3px; }
.row .what { min-width: 0; overflow-wrap: anywhere; }
.row .what b { font-weight: 600; }
.row .what i { font-style: normal; color: var(--mute); }
.row .what.bad, .row .what.bad i { color: var(--bad); }
.switch { display: flex; align-items: center; gap: 2px; font: 11px var(--mono); color: var(--mute); white-space: nowrap; }
.switch button { padding: 0 5px; font: 12px var(--mono); line-height: 1.4; }
.result { padding: 6px 10px 8px 22px; color: var(--mute); font: 12.5px var(--mono); }

/* The inspector. */
.inspector section { padding: 10px 12px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; }
.inspector section:last-child { border-bottom: 0; }
.inspector h3 { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--mute); margin: 0; }
.inspector p { margin: 0; }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 2px 10px; margin: 0; }
.kv dt { color: var(--mute); }
.kv dd { margin: 0; font-family: var(--mono); font-size: 12px; overflow-wrap: anywhere; }
.frame { display: flex; gap: 8px; align-items: center; padding: 4px 6px; border-radius: 5px; border: 1px solid transparent;
  cursor: pointer; background: none; text-align: left; width: 100%; font-weight: 400; }
.frame.on { background: var(--soft); border-color: var(--line); }
.frame small { color: var(--mute); }
.stack { display: flex; flex-direction: column; gap: 1px; }
.note { color: var(--mute); font-size: 12px; }
.messages { display: flex; flex-direction: column; gap: 3px; }
.msg { display: grid; grid-template-columns: 66px minmax(0, 1fr); gap: 8px; font: 12px/1.45 var(--mono); padding: 3px 6px;
  border-radius: 4px; background: var(--soft); overflow-wrap: anywhere; }
.msg span:first-child { color: var(--mute); }
.msg.answer { background: var(--now); }
.ops { margin: 0; padding: 0; list-style: none; font: 12px/1.5 var(--mono); }
.ops li { overflow-wrap: anywhere; }
.forks { display: flex; flex-wrap: wrap; gap: 6px; }
.form { display: flex; flex-direction: column; gap: 6px; }
.form .line { display: flex; gap: 6px; flex-wrap: wrap; }
input[type="text"], textarea { font: 12px var(--mono); color: var(--ink); background: var(--soft); border: 1px solid var(--line);
  border-radius: 5px; padding: 6px 8px; min-width: 0; }
input[type="text"] { flex: 1 1 140px; }
textarea { width: 100%; min-height: 110px; resize: vertical; }
.error { color: var(--bad); font-size: 12px; }

@media (max-width: 1040px) {
  html, body { height: auto; }
  .app { height: auto; }
  .panes { grid-template-columns: minmax(0, 1fr); }
  .scroll { overflow: visible; }
  #tree { overflow-x: auto; }
}
@media (prefers-reduced-motion: no-preference) { .row, .node { transition: background-color .08s; } }
pre.out { margin: 0; font-family: var(--mono); font-size: 12px; white-space: pre-wrap; }
</style>
</head>
<body>

<div class="app">
  <header>
    <h1>Agent Log Debugger</h1>
    <p class="lede">A log is a chain of entries from a root, each named by the hash of its content. Step through one, or fork it from any entry.</p>
    <div class="toolbar" role="toolbar" aria-label="Stepping">
      <button id="first" title="Go to the first entry">First<kbd>Home</kbd></button>
      <button id="back" title="One entry back">Back<kbd>↑</kbd></button>
      <button id="step" class="primary" title="One entry forward">Step<kbd>↓</kbd></button>
      <button id="over" title="Skip what the current call calls">Step over<kbd>O</kbd></button>
      <button id="out" title="Run until the current call returns">Step out<kbd>U</kbd></button>
      <button id="sample" title="Run to the next model call">Next model call<kbd>S</kbd></button>
      <button id="last" title="Go to the last entry">Last<kbd>End</kbd></button>
    </div>
  </header>

  <div class="panes">
    <section class="pane" aria-label="Branches">
      <h2>Branches</h2>
      <div class="scroll"><div id="tree"></div></div>
    </section>

    <section class="pane" aria-label="Log">
      <h2>Log <span id="logTitle"></span></h2>
      <div class="scroll" id="logScroll"><div id="log"></div><div class="result" id="result"></div></div>
    </section>

    <section class="pane inspector" aria-label="Inspector">
      <h2>Entry <span id="inspectorTitle" class="hash"></span></h2>
      <div class="scroll">
        <section id="eventSection"></section>
        <section id="stackSection"></section>
        <section id="frameSection"></section>
        <section id="stateSection"></section>
        <section id="forkSection"></section>
      </div>
    </section>
  </div>
</div>

<script src="engine.js"></script>
<script>
// ---- the tree of logs ----
// Every entry of every branch, once: an entry is named by the hash of its event and of the entry
// before it, so two logs share the entries of their common prefix.
const world = makeWorld();
const nodes = [{ id: 0, parent: null, event: null, hash: '', children: [], depth: -1 }];
const branches = [];
const short = (hash) => hash.slice(0, 12);

function insert(log) {
  let node = nodes[0];
  log.forEach((event, depth) => {
    const hash = entryHash(node.hash, event);
    let child = node.children.map((id) => nodes[id]).find((candidate) => candidate.hash === hash);
    if (!child) {
      child = { id: nodes.length, parent: node.id, event, hash, children: [], depth };
      nodes.push(child);
      node.children.push(child.id);
    }
    node = child;
  });
  return node.id;
}

function pathOf(leaf) {
  const path = [];
  for (let node = nodes[leaf]; node.event; node = nodes[node.parent]) path.unshift(node);
  return path;
}

// A branch is a log: the entries from the first to its last. `how` says how it came about.
function addBranch(run, how) {
  const leaf = insert(run.log);
  let branch = branches.find((candidate) => candidate.leaf === leaf);
  if (!branch) {
    branch = { leaf, how, result: run.result };
    branches.push(branch);
  }
  return branch;
}

// ---- the example: a first run, forks of it, one of them stopped, and two failures ----
const first = addBranch(drive(graded, world, [], firstRunArrivals(world)), 'the first run');
{
  const main = pathOf(first.leaf);
  const log = main.map((node) => node.event);
  const at = (i) => short(main[i].hash);
  const again = addBranch(drive(graded, world, log.slice(0, 18), undefined, 1), `the model asked again in place of ${at(18)}`);
  addBranch(
    drive(graded, world, [...log.slice(0, 35), { kind: 'arrived', notice: { kind: 'said', message: 'also tag the release' } }]),
    `a notice added after ${at(34)}`);
  const other = pathOf(again.leaf);
  addBranch(drive(graded, world, other.slice(0, 22).map((node) => node.event), undefined, 1),
    `the model asked again in place of ${short(other[22].hash)}`);
  addBranch(drive(graded, world, [...log.slice(0, 25), { kind: 'stopped', reason: 'to grade this state' }]), `stopped after ${at(24)}`);
  addBranch(
    drive(graded, world, [...log.slice(0, 32), { ...log[32], answer: { text: 'nothing to commit', workspace: workspace(log.slice(0, 32)), exit: 1 } }]),
    `the command of ${at(32)} made to fail`);
  addBranch(
    drive(graded, world, [...log.slice(0, 18), { kind: 'answered', frame: log[18].frame, op: log[18].op, error: 'overloaded' }]),
    `the model call of ${at(18)} made to fail`);
}

// ---- selection ----
let head = first;
let index = 24;
let frameChoice = null;  // the entry that opened the chosen call, or 'run'
let editing = null;      // 'answer' | 'notice' | null
let replyError = '';
let forkError = '';
const collapsed = new Set();

const path = () => pathOf(head.leaf);
const events = () => path().map((node) => node.event);
const isSample = (event) => event.kind === 'answered' && event.op.kind === 'sample';

// ---- calls, read off the brackets of the log ----
// The nesting of a log is in its entries: a call opens, and returns or fails, and a stop ends
// every call of the agent. So which call an entry belongs to needs no path stored with it.
// For each entry: the call it belongs to, as the position of that call's opening, or -1 for
// the run itself; and for each call, the call it is in.
function callsOf(log) {
  const of = [], parent = new Map();
  let open = [];
  log.forEach((event, i) => {
    if (event.kind === 'opened') {
      parent.set(i, open.length ? open[open.length - 1] : -1);
      open.push(i);
      of.push(i);
    } else if (event.kind === 'returned' || event.kind === 'failed') {
      of.push(open.length ? open.pop() : -1);
    } else if (event.kind === 'stopped') {
      open = [];
      of.push(null);
    } else if (event.kind === 'arrived') {
      of.push(null);
    } else {
      of.push(open.length ? open[open.length - 1] : -1);
    }
  });
  return { of, parent, open };
}
// The calls an entry is inside of, innermost first, ending with the run.
function stackAt(log, i) {
  const { of, parent } = callsOf(log);
  let at = i;
  while (at < log.length && of[at] === null) at += 1;   // a notice or a stop: the call that performs next
  const stack = [];
  for (let call = at < log.length ? of[at] : -1; call !== undefined && call !== -1; call = parent.get(call)) stack.push(call);
  return [...stack, -1];
}
const within = (parent, call, ancestor) => {
  for (let at = call; at !== undefined && at !== -1; at = parent.get(at)) if (at === ancestor) return true;
  return ancestor === -1;
};
const callTitle = (log, call) => {
  if (call === -1) return 'the run';
  const { name } = log[call].tool;
  return { agent: 'the agent', delegate: 'sub-agent', hidden_tests: 'grader hidden_tests' }[name] ?? `tool ${name}`;
};
// The agent is over once it is stopped, or once its call, the first of the log, has ended.
const agentOver = (log, position) => {
  const { of } = callsOf(log.slice(0, position));
  const agent = log.findIndex((event) => event.kind === 'opened');
  return log.slice(0, position).some((event, i) =>
    event.kind === 'stopped' || ((event.kind === 'returned' || event.kind === 'failed') && of[i] === agent));
};

// ---- small DOM helpers ----
function h(tag, attributes, ...children) {
  const element = document.createElement(tag);
  for (const [name, value] of Object.entries(attributes ?? {})) {
    if (name === 'class') element.className = value;
    else if (name.startsWith('on')) element.addEventListener(name.slice(2), value);
    else if (value !== false && value != null) element.setAttribute(name, value === true ? '' : value);
  }
  for (const child of children.flat(Infinity)) if (child != null && child !== false) element.append(child);
  return element;
}
const fill = (id, ...children) => { const element = document.getElementById(id); element.replaceChildren(...children.flat(Infinity).filter(Boolean)); return element; };
const quote = (text) => `"${text}"`;
const hashOf = (hash) => h('span', { class: 'hash' }, short(hash));

/* A glyph for each kind of entry, on a 14 by 14 grid: a seed for the root, a bubble for what a person says, its
   mirror for a reply, a diamond for a change they make, a crate for an external program, a tray for a read of the inbox, a prompt for a model call, a play mark
   for a command, a clock, a bracket with an arrow in for a call that opens, a return arrow, a
   cross for a failure, a warning sign for an operation that failed, a square for a stop. */
const GLYPHS = {
  root: '<circle cx="7" cy="7" r="2.6"/><circle cx="7" cy="7" r="5.6" fill="none"/>',
  said: '<path d="M2 3h10v6H6l-3 2.5V9H2z" fill="none"/>',
  replied: '<path d="M12 3H2v6h6l3 2.5V9h1z" fill="none"/><path d="M4.5 6h5" fill="none"/>',
  changed: '<path d="M7 1.6L12.4 7 7 12.4 1.6 7z" fill="none"/>',
  heard: '<path d="M2 8.5l1.7-5h6.6l1.7 5v3H2z" fill="none"/><path d="M2 8.5h3l.8 1.5h2.4l.8-1.5h3" fill="none"/>',
  sample: '<path d="M2.5 3.5L6 7l-3.5 3.5" fill="none"/><path d="M7.5 10.5h4" fill="none"/>',
  exec: '<path d="M4.5 2.8l6.5 4.2-6.5 4.2z" fill="none"/>',
  external: '<path d="M2 4.5L7 2l5 2.5v5L7 12 2 9.5z" fill="none"/><path d="M2 4.5L7 7l5-2.5M7 7v5" fill="none"/>',
  time: '<circle cx="7" cy="7" r="5.2" fill="none"/><path d="M7 4v3l2.2 1.4" fill="none"/>',
  opened: '<path d="M5.5 2.5h-3v9h3" fill="none"/><path d="M6 7h6M9.8 4.8L12 7l-2.2 2.2" fill="none"/>',
  returned: '<path d="M6 3.5L2.5 7 6 10.5" fill="none"/><path d="M2.5 7h5.5a3 3 0 0 1 3 3v1.5" fill="none"/>',
  failed: '<path d="M3.2 3.2l7.6 7.6M10.8 3.2l-7.6 7.6" fill="none"/>',
  error: '<path d="M7 1.8L12.6 11.8H1.4z" fill="none"/><path d="M7 5.4v3" fill="none"/><circle cx="7" cy="10.1" r=".7" stroke="none"/>',
  stopped: '<path d="M3.5 3.5h7v7h-7z" fill="none"/>',
};
const glyphOf = (event, root = false) =>
  root ? 'root'
    : event.kind === 'arrived' ? event.notice.kind
    : event.kind !== 'answered' ? event.kind
    : event.error !== undefined ? 'error' : event.op.kind;
const GLYPH_NAMES = { root: 'the root: the workspace the run starts on', said: 'a person says', replied: 'a person replies to a question', changed: 'a change from outside', heard: 'a read of the inbox', sample: 'a model call',
  exec: 'a command', external: 'an external program, in a container of its own', time: 'the clock', opened: 'a call opens', returned: 'a call returns', failed: 'a call fails',
  error: 'an operation that failed', stopped: 'a stop from outside' };
function icon(event, root = false) {
  const key = glyphOf(event, root);
  const holder = h('span', { class: `ic i-${key}`, title: GLYPH_NAMES[key] });
  holder.innerHTML = '<svg viewBox="0 0 14 14" width="13" height="13" stroke="currentColor" stroke-width="1.5" ' +
    'stroke-linecap="round" stroke-linejoin="round" fill="currentColor" aria-hidden="true">' + GLYPHS[key] + '</svg>';
  return holder;
}
const TWISTIES = {
  open: '<path d="M3 5h8l-4 4.5z"/>',
  closed: '<path d="M5 3v8l4.5-4z"/>',
  leaf: '<circle cx="7" cy="7" r="1.6"/>',
};
function twisty(which) {
  const holder = h('span', { class: `tw${which === 'leaf' ? ' leaf' : ''}` });
  holder.innerHTML = '<svg viewBox="0 0 14 14" width="12" height="12" fill="currentColor" aria-hidden="true">' + TWISTIES[which] + '</svg>';
  return holder;
}

function answerSummary(event) {
  const { op, answer } = event;
  if (event.error !== undefined) return `failed: ${quote(event.error)}`;
  if (op.kind === 'sample') {
    return answer.toolCalls.length
      ? `calls ${answer.toolCalls.map((call) => call.name).join(', ')}`
      : `says ${quote(answer.text)}`;
  }
  if (op.kind === 'exec') return `workspace ${answer.workspace}`;
  if (op.kind === 'external') return `exit ${answer.exit}, ${verdict(answer.stdout).replace(/^\w+ /, '')} checks`;
  if (op.kind === 'time') return `${answer.spent / 1000} s of ${answer.budget / 1000} s`;
  return '';
}
const opText = (op) => (op.kind === 'exec' ? ` ${op.command}` : op.kind === 'external' ? ` ${op.command} in ${op.image}` : '');
// Who took which notice, read off the log: the mark of a read says which notices it took.
const heardAt = (log, i) => log[i].notices;
const readerOf = (log, i) => log.findIndex((event) => event.kind === 'heard' && event.notices.includes(i));
const unreadAt = (log, i) =>
  log.slice(0, i + 1).flatMap((event, j) => (j > 0 && event.kind === 'arrived' && !log.slice(0, i + 1).some((e) => e.kind === 'heard' && e.notices.includes(j)) ? [j] : []));
function noticeText(notice) {
  return notice.kind === 'said' ? `said ${quote(notice.message)}`
    : notice.kind === 'replied' ? `replied ${quote(renderReply(notice.reply))}`

// ---- rendering: the tree of entries ----

const sizes = new Map();

  go(node.depth);

// ---- rendering: the log of the branch ----

// ---- rendering: the inspector ----
function renderInspector() {
  const nodesOnPath = path();

      ['workspace', event.notice.workspace], ['what', event.notice.summary],

    const { system, agent, model } = configOf(event);
    rows.push(['kind', 'the agent is called, with its configuration'], ['system', system],
      ['agent', `tools ${agent.tools.join(', ')}; asks a model that failed again ${agent.retries} times`],
      ['model', `${model.name}; at most ${model.maxTokens} tokens`]);
  } else if (event.kind === 'stopped') {
    rows.push(['kind', 'a stop from outside: every call of the agent ends here'], ['reason', event.reason],
      ['then', 'the run goes on with what follows the agent: the graders']);
  } else if (event.kind === 'arrived') {
    const reader = readerOf(log, index);
    const asked = event.notice.kind === 'replied' ? log.findIndex((e) => e.kind === 'opened' && same(e.frame, event.notice.to)) : -1;
    rows.push(['kind', event.notice.kind === 'replied' ? 'a reply: a person answers a question, in their own time' : 'a notice: nothing in the program asked for it'],
      ['what', noticeText(event.notice)]);
    if (event.notice.kind === 'replied') rows.push(
      ['to', asked < 0 ? 'a call this log does not hold' : `the question of ${entry(asked)}: ${quote(parseQuestion(log[asked].tool.arguments).text)}`],
      ['form', { yes: 'yes or no', no: 'yes or no', option: 'one of the options', none: 'none of the options', text: 'their own words', unavailable: 'no one could answer' }[event.notice.reply.kind]]);
    rows.push(
      ['read', reader < 0 ? 'by no one in this log' : `at ${entry(reader)}, by ${callTitle(log, callsOf(log).of[reader])}`]);
  } else if (event.kind === 'heard') {
    const got = heardAt(log, index);
    rows.push(['kind', `a read of the inbox by ${callTitle(log, callsOf(log).of[index])}`],
      ['takes', got.length ? got.map((j) => `${entry(j)}: ${noticeText(log[j].notice)}`).join('; ') : 'nothing: no notice is unread']);
  } else if (event.kind === 'opened') {
    rows.push(['kind', 'a call opens'], ['calls', `${event.tool.name}(${quote(event.tool.arguments)})`]);

      ['runs on', `a checkout of workspace ${workspace(log.slice(0, index))}${event.op.input ? `, with ${event.op.input} to read` : ''}`],

        h('span', {}, callTitle(log, call),

            : h('small', {}, ` called with ${quote(log[call].tool.arguments)}`))))));

  const samples = own.filter(([e]) => isSample(e));

  if (samples.length) {

    content.push(h('p', { class: 'note' }, 'Its context at its latest model call, ', hashOf(hashes[at]), `: ${messages.length} messages.`));
    content.push(h('div', { class: 'messages' },
      messages.map((message) => h('div', { class: 'msg' }, h('span', {}, message.role),

      h('button', { disabled: !isSample(event), onclick: askAgain, title: 'Continue the log up to this entry with a new answer from the model' }, 'Ask the model again'),
      h('button', { disabled: !answered || event.error !== undefined, onclick: () => { editing = editing === 'answer' ? null : 'answer'; forkError = ''; renderInspector(); } }, 'Edit this answer'),
      h('button', { disabled: !answered || event.error !== undefined, onclick: makeFail, title: 'Continue the log up to this entry with an error as the answer to this call' }, 'Make this call fail'),
      h('button', { onclick: () => { editing = editing === 'notice' ? null : 'notice'; forkError = ''; renderInspector(); } }, 'Add a notice after it'),
      h('button', { disabled: agentOver(log, index + 1), onclick: stopHere, title: 'Stop the agent after this entry, on a branch of its own: what follows the agent in the run, its graders, runs there' }, 'Stop the agent here')),
    editing === 'answer' && h('div', { class: 'form' },
      h('textarea', { id: 'answerText', 'aria-label': 'The answer, as JSON', spellcheck: 'false' }, JSON.stringify(event.answer, null, 2)),
      h('div', { class: 'line' }, h('button', { class: 'primary', onclick: () => runEditedAnswer(document.getElementById('answerText').value) }, 'Run from this answer'))),
    editing === 'notice' && h('form', { class: 'form', onsubmit: (e) => { e.preventDefault(); addNotice(document.getElementById('noticeText').value); } },
      h('div', { class: 'line' },
        h('input', { id: 'noticeText', type: 'text', placeholder: 'What the person says', 'aria-label': 'What the person says' }),
        h('button', { class: 'primary', type: 'submit' }, 'Add and run'))),
    forkError && h('p', { class: 'error', role: 'alert' }, forkError),
    h('p', { class: 'note' }, 'A fork keeps the log up to this entry and runs the agent on from there, as a new branch. The model here is scripted. Everything else on this page is read off the log alone.'));
}

function render() {
  const last = events().length - 1;
  for (const [id, off] of [['first', index === 0], ['back', index === 0], ['step', index === last], ['over', index === last],
    ['out', index === last], ['sample', index === last], ['last', index === last]]) document.getElementById(id).disabled = off;
  renderTree();
  renderLog();
  renderInspector();
}

// ---- controls ----
const actions = {

document.addEventListener('keydown', (e) => {
  if (e.target.matches('input, textarea') || e.metaKey || e.ctrlKey || e.altKey) return;
  const action = {
    ArrowDown: actions.step, ArrowRight: actions.step, j: actions.step,
