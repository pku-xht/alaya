<g transform="translate(0,225.5)"><path class="a" d="M12,0H74"/><path fill="#a3abb5" d="M78,0l-5,-2.5v5z"/><rect x="26" y="-7" width="34" height="13" fill="#fff"/><text x="43" y="3.5" class="s" text-anchor="middle">model</text></g><text x="90" y="229" class="s">the program asks; the driver carries it out and appends the answer</text>
