<rect x="12" y="118" width="2" height="56" fill="#e3e6ea"/>
<text x="336" y="63" class="r">ASSISTANT</text>
<rect x="336.5" y="72.5" width="205" height="35" rx="6" fill="#fff" stroke="#e3e6ea"/>
<text x="347" y="94">Listing.</text>
<text x="336" y="125" class="s">calls bash · command</text>
