<text x="347" y="154" class="ch">ls</text>
<rect x="322" y="52" width="2" height="115" fill="#3567a0"/>
<text x="322" y="188" class="s">finish reason</text>
<text x="405.2" y="188" class="s n" style="fill:#1c1e21">tool_calls</text>
<text x="322" y="204" class="s">usage</text>
<text x="405.2" y="204" class="s n" style="fill:#1c1e21">in 212 · out 18</text>
<text x="652" y="40" class="s">2 earlier messages, as in the request before</text>
<text x="666" y="63" class="r">ASSISTANT</text>
