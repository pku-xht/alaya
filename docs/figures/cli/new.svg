<rect x="190.5" y="22.5" width="120" height="24" rx="6" fill="#dfe9f6" stroke="#3567a0"/>
<g transform="translate(198,28) scale(0.9286)" stroke="#4a4f57" fill="#4a4f57" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="7" r="2.6"/><circle cx="7" cy="7" r="5.6" fill="none"/></g>
