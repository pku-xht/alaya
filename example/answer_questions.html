<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Questions · Alaya</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #202a36; background: #f5f6f8; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    button, textarea, input { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: default; opacity: .5; }
    button:focus-visible, textarea:focus-visible, input:focus-visible { outline: 3px solid #7fa8ee; outline-offset: 3px; }
    .topbar { background: #fff; border-bottom: 1px solid #dce1e7; }
    .topbar-inner { max-width: 860px; margin: auto; padding: 20px 24px; display: flex; align-items: center; gap: 16px; }
    .brand { font-weight: 750; letter-spacing: -.04em; font-size: 22px; }
    .section-label { color: #697686; border-left: 1px solid #dce1e7; padding-left: 16px; font-size: 14px; }
    main { max-width: 860px; margin: auto; padding: 40px 24px 64px; }
    .heading { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 12px; }
    h1 { margin: 0; font-size: clamp(25px, 4vw, 32px); font-weight: 650; letter-spacing: -.035em; }
    .intro { color: #697686; margin: 0 0 28px; line-height: 1.6; }
    .secondary { background: #fff; border: 1px solid #cdd5df; color: #344253; border-radius: 6px; padding: 9px 16px; min-height: 42px; }
    .secondary:hover { background: #edf1f6; }
    #notice { margin-bottom: 20px; padding: 13px 16px; border: 1px solid #b7d6c5; background: #edf7f1; color: #21563b; border-radius: 6px; line-height: 1.5; }
    #notice[data-error="true"] { border-color: #e5b5b1; background: #fff1ef; color: #953b33; }
    [hidden] { display: none !important; }
    .question { background: #fff; border: 1px solid #dce1e7; border-radius: 10px; margin: 0 0 20px; padding: 26px; }
    .type { margin: 0 0 14px; color: #5d6d82; font-size: 12px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; }
    fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
    legend { float: left; width: 100%; padding: 0; margin: 0 0 12px; font-size: 18px; font-weight: 600; line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere; }
    .fields { clear: both; }
    .help { margin: 0 0 18px; color: #697686; font-size: 14px; line-height: 1.55; }
    .options { display: grid; gap: 10px; }
    .options.binary { grid-template-columns: 1fr 1fr; }
    .option { display: flex; align-items: flex-start; gap: 12px; border: 1px solid #d7dde5; padding: 14px; border-radius: 6px; cursor: pointer; min-height: 50px; }
    .option:hover { background: #f7f9fc; border-color: #9eaec2; }
    .option:has(input:checked) { background: #edf3ff; border-color: #5478b7; }
    .option input { flex: 0 0 auto; width: 18px; height: 18px; margin: 2px 0 0; accent-color: #355e9c; }
    .option span { line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; min-width: 0; }
    textarea { display: block; width: 100%; min-height: 140px; resize: vertical; border: 1px solid #bdc7d5; border-radius: 6px; padding: 13px; line-height: 1.55; }
    .actions { margin-top: 22px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .selection { color: #697686; font-size: 13px; }
    .primary { background: #31598f; color: #fff; border: 1px solid #31598f; border-radius: 6px; padding: 11px 20px; font-weight: 600; min-height: 44px; }
    .primary:hover:not(:disabled) { background: #234775; }
    .error { color: #a3332b; margin: 16px 0 0; font-size: 14px; line-height: 1.55; }
    .empty { padding: 42px 24px; text-align: center; color: #697686; border: 1px dashed #cdd5df; border-radius: 8px; line-height: 1.6; }
    .empty strong { display: block; color: #344253; font-weight: 600; margin-bottom: 6px; }
    @media (max-width: 520px) {
      main { padding: 26px 16px 40px; }
      .topbar-inner { padding: 16px; }
      .question { padding: 20px 16px; }
      .heading { gap: 12px; }
      .options.binary { grid-template-columns: 1fr; }
      .actions { align-items: stretch; flex-direction: column; gap: 12px; }
      .primary { width: 100%; }
    }
  </style>
</head>
<body>
  <header class="topbar"><div class="topbar-inner"><span class="brand">Alaya</span><span class="section-label">Questions</span></div></header>
  <main>
    <div class="heading"><h1>Waiting for your answer</h1><button id="refresh" class="secondary" type="button">Refresh</button></div>
    <p class="intro" id="count" aria-live="polite">Loading questions…</p>
    <div id="notice" role="status" hidden></div>
    <div id="questions"></div>
    <div id="empty" class="empty" hidden><strong>No questions waiting</strong>New questions will appear here when you refresh.</div>
  </main>
  <script>
    'use strict';
    const token = '__ALAYA_TOKEN__';
    const questions = document.getElementById('questions');
    const count = document.getElementById('count');
    const notice = document.getElementById('notice');
    const empty = document.getElementById('empty');
    const refresh = document.getElementById('refresh');
    let refreshing = false;
    let submitting = 0;
    const forms = new Map();

    function element(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }
    function announce(text, error = false) {
      notice.hidden = false;
      notice.dataset.error = String(error);
      notice.setAttribute('role', error ? 'alert' : 'status');
      notice.textContent = text;
    }
    function updateCount() {
      const n = forms.size;
      count.textContent = n === 1 ? '1 question needs your input.' : `${n} questions need your input.`;
      empty.hidden = n !== 0;
    }
    function updateBusy() {
      refresh.disabled = refreshing || submitting > 0;
      for (const form of forms.values()) form.update();
    }
    async function api(path, payload) {
      let response;
      try {
        response = await fetch(path, {
          method: payload === undefined ? 'GET' : 'POST',
          headers: {'X-Alaya-Token': token, ...(payload === undefined ? {} : {'Content-Type': 'application/json'})},
          ...(payload === undefined ? {} : {body: JSON.stringify(payload)})
        });
      } catch (_) {
        throw new Error('Could not reach Alaya. Check that the answer page is still running, then try again.');
      }
      let result;
      try { result = await response.json(); }
      catch (_) { throw new Error('Alaya returned an unreadable response. Please try again.'); }
      if (!response.ok) throw new Error(result.error || 'The answer could not be saved. Please try again.');
      return result;
    }
    function questionForm(question) {
      const form = element('form', 'question');
      form.dataset.state = question.state;
      const kinds = {yes_no: 'Yes / no', multiple_choice: 'Multiple choice', open_ended: 'Open question'};
      form.append(element('p', 'type', kinds[question.question_type]));
      const fieldset = element('fieldset');
      fieldset.append(element('legend', null, question.question));
      const fields = element('div', 'fields');
      const help = element('p', 'help');
      help.id = `help-${question.state}`;
      fieldset.setAttribute('aria-describedby', help.id);
      fields.append(help);
      let textarea;
      const inputs = [];
      if (question.question_type === 'open_ended') {
        help.textContent = 'Write your answer below.';
        textarea = element('textarea');
        textarea.setAttribute('aria-label', 'Your answer');
        textarea.required = true;
        fields.append(textarea);
      } else {
        const binary = question.question_type === 'yes_no';
        help.textContent = binary ? 'Choose one answer.' : 'Select any that apply. You can also submit with no options selected.';
        const options = element('div', 'options' + (binary ? ' binary' : ''));
        const choices = binary ? ['Yes', 'No'] : question.options;
        choices.forEach((text, index) => {
          const label = element('label', 'option');
          const input = element('input');
          input.type = binary ? 'radio' : 'checkbox';
          input.name = `answer-${question.state}`;
          input.value = binary ? ['yes', 'no'][index] : String(index + 1);
          if (binary) input.required = true;
          inputs.push(input);
          label.append(input, element('span', null, text));
          options.append(label);
        });
        fields.append(options);
      }
      fieldset.append(fields);
      form.append(fieldset);
      const actions = element('div', 'actions');
      const selection = element('span', 'selection');
      selection.setAttribute('aria-live', 'polite');
      const submit = element('button', 'primary', 'Submit answer');
      submit.type = 'submit';
      actions.append(selection, submit);
      const error = element('p', 'error');
      error.setAttribute('role', 'alert');
      error.hidden = true;
      form.append(actions, error);
      let busy = false;
      function update() {
        const selected = inputs.filter(input => input.checked);
        const binary = question.question_type === 'yes_no';
        const valid = textarea ? textarea.value.trim().length > 0 : !binary || selected.length === 1;
        submit.disabled = busy || refreshing || !valid;
        submit.textContent = busy ? 'Submitting…' : 'Submit answer';
        fieldset.disabled = busy;
        selection.textContent = textarea ? '' : binary
          ? (selected.length ? `${selected[0].value === 'yes' ? 'Yes' : 'No'} selected` : 'Choose yes or no')
          : `${selected.length} of ${inputs.length} selected`;
      }
      form.addEventListener('input', update);
      form.addEventListener('change', update);
      form.addEventListener('submit', async event => {
        event.preventDefault();
        if (submit.disabled || busy) return;
        const selected = inputs.filter(input => input.checked);
        const answer = textarea ? textarea.value : question.question_type === 'yes_no'
          ? selected[0].value : JSON.stringify(selected.map(input => Number(input.value)));
        busy = true;
        submitting++;
        error.hidden = true;
        updateBusy();
        try {
          await api('/api/reply', {state: question.state, answer});
          forms.delete(question.state);
          form.remove();
          updateCount();
          announce('Answer submitted and saved.');
          if (forms.size === 0) refresh.focus();
        } catch (problem) {
          error.textContent = problem.message;
          error.hidden = false;
        } finally {
          busy = false;
          submitting--;
          updateBusy();
        }
      });
      return {node: form, update};
    }
    async function load() {
      if (refreshing || submitting) return;
      refreshing = true;
      updateBusy();
      try {
        const result = await api('/api/questions');
        if (notice.dataset.error === 'true') notice.hidden = true;
        forms.clear();
        questions.replaceChildren();
        for (const question of result.questions) {
          const form = questionForm(question);
          forms.set(question.state, form);
          questions.append(form.node);
        }
        updateCount();
      } catch (problem) {
        announce(problem.message, true);
        if (forms.size === 0) count.textContent = 'Questions could not be loaded.';
      } finally {
        refreshing = false;
        updateBusy();
      }
    }
    refresh.addEventListener('click', load);
    load();
  </script>
</body>
</html>
