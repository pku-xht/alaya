<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="alaya-token" content="__ALAYA_TOKEN__">
  <title>Questions · Alaya</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #202a36; background: #f5f6f8; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    button, textarea, input { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: default; opacity: .5; }
    button:focus-visible, textarea:focus-visible, input:focus-visible, summary:focus-visible, pre:focus-visible { outline: 3px solid #7fa8ee; outline-offset: 3px; }
    .topbar { background: #fff; border-bottom: 1px solid #dce1e7; }
    .topbar-inner { max-width: 860px; margin: auto; padding: 20px 24px; display: flex; align-items: center; gap: 16px; }
    .brand { font-weight: 750; letter-spacing: -.04em; font-size: 22px; }
    .section-label { color: #697686; border-left: 1px solid #dce1e7; padding-left: 16px; font-size: 14px; }
    main { max-width: 860px; margin: auto; padding: 40px 24px 64px; }
    .heading { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 12px; }
    h1 { margin: 0; font-size: clamp(25px, 4vw, 32px); font-weight: 650; letter-spacing: -.035em; }
    .intro { color: #697686; margin: 0 0 8px; line-height: 1.6; }
    .connection { color: #697686; margin: 0 0 28px; font-size: 13px; line-height: 1.5; }
    .secondary { background: #fff; border: 1px solid #cdd5df; color: #344253; border-radius: 6px; padding: 9px 16px; min-height: 42px; }
    .secondary:hover { background: #edf1f6; }
    #notice { margin-bottom: 20px; padding: 13px 16px; border: 1px solid #b7d6c5; background: #edf7f1; color: #21563b; border-radius: 6px; line-height: 1.5; }
    #notice[data-error="true"] { border-color: #e5b5b1; background: #fff1ef; color: #953b33; }
    [hidden] { display: none !important; }
    .question { background: #fff; border: 1px solid #dce1e7; border-radius: 10px; margin: 0 0 20px; padding: 26px; }
    .type { margin: 0 0 14px; color: #5d6d82; font-size: 12px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; }
    fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
    legend { float: left; width: 100%; padding: 0; margin: 0 0 12px; font-size: 18px; font-weight: 600; line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere; }
    .fields { clear: both; }
    .help { margin: 0 0 18px; color: #697686; font-size: 14px; line-height: 1.55; }
    .options { display: grid; gap: 10px; }
    .options.binary { grid-template-columns: 1fr 1fr; }
    .option { display: flex; align-items: flex-start; gap: 12px; border: 1px solid #d7dde5; padding: 14px; border-radius: 6px; cursor: pointer; min-height: 50px; }
    .option:hover { background: #f7f9fc; border-color: #9eaec2; }
    .option:has(input:checked) { background: #edf3ff; border-color: #5478b7; }
    .option input { flex: 0 0 auto; width: 18px; height: 18px; margin: 2px 0 0; accent-color: #355e9c; }
    .option span { line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; min-width: 0; }
    .legacy-options { padding-left: 24px; margin: 0; color: #697686; line-height: 1.6; }
    .legacy-options li { padding: 4px 0; white-space: pre-wrap; overflow-wrap: anywhere; }
    textarea { display: block; width: 100%; min-height: 140px; resize: vertical; border: 1px solid #bdc7d5; border-radius: 6px; padding: 13px; line-height: 1.55; }
    .actions { margin-top: 22px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .selection { color: #697686; font-size: 13px; }
    .primary { background: #31598f; color: #fff; border: 1px solid #31598f; border-radius: 6px; padding: 11px 20px; font-weight: 600; min-height: 44px; }
    .primary:hover:not(:disabled) { background: #234775; }
    .answer-buttons { display: flex; flex-wrap: wrap; gap: 10px; }
    .unavailable-help { margin: 12px 0 0; color: #697686; font-size: 13px; line-height: 1.55; }
    .context-status { color: #697686; font-size: 14px; line-height: 1.55; margin: 0; }
    .context-error { margin-top: 8px; }
    .context-error .error { margin: 0 0 10px; }
    .context-panels { margin-top: 26px; border-top: 1px solid #e5e9ee; }
    .context-panel { border-bottom: 1px solid #e5e9ee; }
    summary { cursor: pointer; overflow-wrap: anywhere; }
    .context-panel > summary { padding: 16px 0; font-size: 14px; font-weight: 600; color: #344253; }
    .panel-body { padding: 0 0 18px; min-width: 0; }
    .panel-body > .help { margin-bottom: 14px; }
    .history-step { margin: 8px 0; border: 1px solid #dce1e7; border-radius: 6px; }
    .history-step > summary { padding: 12px; font-size: 13px; font-weight: 600; }
    .history-events { padding: 0 12px 12px; }
    .history-event + .history-event { margin-top: 18px; padding-top: 16px; border-top: 1px solid #e5e9ee; }
    .event-label { margin: 0 0 8px; color: #5d6d82; font-size: 12px; font-weight: 650; }
    .record-text { font: 13px/1.65 ui-monospace, "Cascadia Code", Consolas, monospace; white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; overflow: auto; max-height: 420px; }
    .tool-call { margin-top: 10px; padding: 10px 12px; border-left: 2px solid #bacce5; background: #f7f9fc; }
    .raw-event { margin-top: 10px; color: #697686; font-size: 12px; }
    .raw-event > summary { padding: 6px 0; }
    .raw-event .record-text { color: #344253; }
    .file-path { display: flex; align-items: center; gap: 3px; flex-wrap: wrap; margin-bottom: 10px; }
    .path-button { background: none; border: 0; border-radius: 4px; color: #31598f; padding: 6px 8px; min-height: 36px; overflow-wrap: anywhere; max-width: 100%; text-align: left; }
    .path-button:hover { background: #edf3ff; }
    .path-button[aria-current="location"] { color: #344253; font-weight: 600; }
    .path-separator { color: #8d98a6; }
    .file-list { padding: 0; margin: 0; list-style: none; border: 1px solid #dce1e7; border-radius: 6px; overflow: hidden; max-height: 300px; overflow-y: auto; }
    .file-list li + li { border-top: 1px solid #e5e9ee; }
    .file-entry { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; padding: 11px 12px; min-height: 44px; color: #344253; background: #fff; border: 0; text-align: left; }
    .file-entry:hover { background: #f2f6fc; }
    .file-entry:focus-visible { outline-offset: -3px; }
    .file-entry[aria-pressed="true"] { background: #edf3ff; box-shadow: inset 3px 0 #5478b7; }
    .file-name { overflow-wrap: anywhere; min-width: 0; }
    .file-kind { flex: 0 0 auto; font-size: 12px; color: #697686; }
    .file-view { margin-top: 16px; }
    .file-title { margin: 0 0 10px; font-size: 13px; font-weight: 650; overflow-wrap: anywhere; }
    .file-content { background: #f7f9fc; border: 1px solid #dce1e7; border-radius: 6px; padding: 14px; max-height: 500px; }
    .error { color: #a3332b; margin: 16px 0 0; font-size: 14px; line-height: 1.55; }
    .empty { padding: 42px 24px; text-align: center; color: #697686; border: 1px dashed #cdd5df; border-radius: 8px; line-height: 1.6; }
    .empty strong { display: block; color: #344253; font-weight: 600; margin-bottom: 6px; }
    @media (max-width: 520px) {
      main { padding: 26px 16px 40px; }
      .topbar-inner { padding: 16px; }
      .question { padding: 20px 16px; }
      .heading { gap: 12px; }
      .options.binary { grid-template-columns: 1fr; }
      .actions { align-items: stretch; flex-direction: column; gap: 12px; }
      .primary { width: 100%; }
      .answer-buttons { flex-direction: column-reverse; }
      .answer-buttons button { width: 100%; }
    }
  </style>
</head>
<body>
  <header class="topbar"><div class="topbar-inner"><span class="brand">Alaya</span><span class="section-label">Questions</span></div></header>
  <main>
    <div class="heading"><h1>Waiting for your answer</h1></div>
    <p class="intro" id="count" aria-live="polite">Loading questions…</p>
    <p class="connection" id="connection" role="status">Connecting…</p>
    <div id="notice" role="status" hidden></div>
    <div id="questions"></div>
    <div id="empty" class="empty" hidden><strong>No questions waiting</strong>The next question will appear here automatically.</div>
  </main>
  <script>
    'use strict';
    let token = document.querySelector('meta[name="alaya-token"]').content;
    const questions = document.getElementById('questions');
    const count = document.getElementById('count');
    const notice = document.getElementById('notice');
    const empty = document.getElementById('empty');
    const connection = document.getElementById('connection');
    let submitting = 0;
    let pendingQuestions = null;
    const forms = new Map();
    const answered = new Set();

    function element(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }
    function announce(text, error = false) {
      notice.hidden = false;
      notice.dataset.error = String(error);
      notice.setAttribute('role', error ? 'alert' : 'status');
      notice.textContent = text;
    }
    function updateCount() {
      const n = forms.size;
      count.textContent = n === 1 ? '1 question needs your input.' : `${n} questions need your input.`;
      empty.hidden = n !== 0;
    }
    function updateBusy() {
      for (const form of forms.values()) form.update();
    }
    async function api(path, payload) {
      let response;
      try {
        response = await fetch(path, {
          method: payload === undefined ? 'GET' : 'POST',
          headers: {'X-Alaya-Token': token, ...(payload === undefined ? {} : {'Content-Type': 'application/json'})},
          ...(payload === undefined ? {} : {body: JSON.stringify(payload)})
        });
      } catch (_) {
        throw new Error('Could not reach Alaya. Check that the answer page is still running, then try again.');
      }
      let result;
      try { result = await response.json(); }
      catch (_) { throw new Error('Alaya returned an unreadable response. Please try again.'); }
      if (!response.ok) throw new Error(result.error || 'The answer could not be saved. Please try again.');
      return result;
    }
    function readable(value) {
      return typeof value === 'string' ? value : JSON.stringify(value, null, 2);
    }
    function recordText(value, className = '') {
      const node = element('pre', `record-text ${className}`, readable(value));
      node.tabIndex = 0;
      return node;
    }
    function disclosure(title, className) {
      const node = element('details', className);
      node.append(element('summary', null, title));
      return node;
    }
    function historyEvent(event, kind, calls) {
      const node = element('div', 'history-event');
      const message = event.message || event.response || event;
      const role = event.type === 'response' ? 'assistant' : message.role;
      const callId = event.call_id || message.tool_call_id;
      const callName = calls.get(callId);
      const isResult = event.type === 'observation' || role === 'tool';
      const label = isResult ? (kind === 'reply' ? 'Previous answer' : `Tool result${callName ? ` · ${callName}` : ''}`)
        : ({system: 'Task instructions', user: 'User', assistant: 'Assistant'}[role] || 'Recorded event');
      node.append(element('p', 'event-label', label));
      if (message.content !== null && message.content !== undefined) {
        const unavailable = kind === 'reply' && message.content.status === 'unavailable';
        node.append(recordText(unavailable ? 'Unable to answer' : message.content));
      }
      for (const call of message.tool_calls || []) {
        calls.set(call.id, call.name);
        const block = element('div', 'tool-call');
        block.append(element('p', 'event-label', `Tool call · ${call.name}`), recordText(call.arguments));
        node.append(block);
      }
      const raw = disclosure('Full recorded event', 'raw-event');
      raw.append(recordText(event));
      node.append(raw);
      return node;
    }
    function contextPanels(question) {
      let disposed = false;
      let contextVersion = 0;
      let navigationVersion = 0;
      let filesLoaded = false;
      const query = `state=${encodeURIComponent(question.state)}`;
      const panels = element('div', 'context-panels');
      const history = disclosure('Full conversation', 'context-panel');
      history.dataset.panel = 'history';
      const historyBody = element('div', 'panel-body');
      historyBody.append(element('p', 'help', 'This branch’s recorded conversation, from the task instructions through this question.'));
      const historyContent = element('div');
      historyContent.append(element('p', 'context-status', 'Loading conversation…'));
      historyBody.append(historyContent);
      history.append(historyBody);
      const files = disclosure('Project files', 'context-panel');
      files.dataset.panel = 'files';
      const fileBody = element('div', 'panel-body');
      fileBody.append(element('p', 'help', 'Read-only files saved when this question was asked. Later changes are not shown here.'));
      const breadcrumbs = element('nav', 'file-path');
      breadcrumbs.setAttribute('aria-label', 'Project folder');
      const fileStatus = element('p', 'context-status');
      fileStatus.setAttribute('role', 'status');
      const fileError = element('div', 'context-error');
      const fileList = element('ul', 'file-list');
      fileList.hidden = true;
      const fileView = element('div', 'file-view');
      fileView.hidden = true;
      fileBody.append(breadcrumbs, fileStatus, fileError, fileList, fileView);
      files.append(fileBody);
      panels.append(history, files);

      function showError(container, problem, retry) {
        const message = element('p', 'error', problem.message);
        message.setAttribute('role', 'alert');
        const button = element('button', 'secondary', 'Try again');
        button.type = 'button';
        button.addEventListener('click', retry);
        container.replaceChildren(message, button);
      }
      async function loadContext() {
        const version = ++contextVersion;
        historyContent.replaceChildren(element('p', 'context-status', 'Loading conversation…'));
        try {
          const result = await api(`/api/context?${query}`);
          if (disposed || version !== contextVersion) return;
          const calls = new Map();
          const steps = result.history.map((step, index) => {
            const labels = {root: 'Starting instructions', reply: 'Human reply', turn: 'Agent step', question: 'Question', message: 'Human message', intervention: 'Workspace change', evaluation: 'Evaluation'};
            const node = disclosure(`${index + 1}. ${labels[step.kind] || 'Recorded step'} · ${step.events.length} event${step.events.length === 1 ? '' : 's'}`, 'history-step');
            const events = element('div', 'history-events');
            for (const event of step.events) events.append(historyEvent(event, step.kind, calls));
            if (!step.events.length) events.append(element('p', 'context-status', 'No messages or tool results in this step.'));
            node.append(events);
            return node;
          });
          historyContent.replaceChildren(...steps);
          if (!steps.length) historyContent.append(element('p', 'context-status', 'No conversation was recorded before this question.'));
        } catch (problem) {
          if (disposed || version !== contextVersion) return;
          showError(historyContent, problem, loadContext);
        }
      }
      function renderPath(path) {
        const segments = path ? path.split('/') : [];
        const parts = ['Project', ...segments];
        breadcrumbs.replaceChildren();
        parts.forEach((name, index) => {
          if (index) breadcrumbs.append(element('span', 'path-separator', '/'));
          const button = element('button', 'path-button', name);
          button.type = 'button';
          if (index === parts.length - 1) button.setAttribute('aria-current', 'location');
          button.addEventListener('click', () => loadDirectory(segments.slice(0, index).join('/'), true));
          breadcrumbs.append(button);
        });
      }
      async function loadDirectory(path = '', moveFocus = false) {
        const version = ++navigationVersion;
        fileStatus.textContent = 'Loading folder…';
        fileError.replaceChildren();
        const focusOwner = document.activeElement;
        try {
          const result = await api(`/api/files?${query}&path=${encodeURIComponent(path)}`);
          if (disposed || version !== navigationVersion) return;
          const restoreFocus = moveFocus && document.activeElement === focusOwner;
          filesLoaded = true;
          renderPath(result.path);
          fileView.hidden = true;
          fileView.replaceChildren();
          fileList.replaceChildren();
          for (const entry of result.entries) {
            const row = element('li');
            const button = element('button', 'file-entry');
            button.type = 'button';
            button.dataset.path = entry.path;
            const kind = {directory: 'Folder', file: 'File', symlink: 'Link', other: 'Other'}[entry.kind] || 'Other';
            button.setAttribute('aria-label', `${entry.name}, ${kind}`);
            button.append(element('span', 'file-name', entry.name), element('span', 'file-kind', kind));
            button.addEventListener('click', () => entry.kind === 'directory' ? loadDirectory(entry.path, true) : loadFile(entry.path));
            row.append(button);
            fileList.append(row);
          }
          fileList.hidden = result.entries.length === 0;
          fileStatus.textContent = result.entries.length ? '' : 'This folder is empty.';
          if (restoreFocus) breadcrumbs.lastElementChild.focus();
        } catch (problem) {
          if (disposed || version !== navigationVersion) return;
          fileStatus.textContent = '';
          showError(fileError, problem, () => loadDirectory(path, true));
        }
      }
      async function loadFile(path) {
        const version = ++navigationVersion;
        fileStatus.textContent = 'Loading file…';
        fileError.replaceChildren();
        try {
          const result = await api(`/api/file?${query}&path=${encodeURIComponent(path)}`);
          if (disposed || version !== navigationVersion) return;
          const title = element('h3', 'file-title', result.path);
          fileView.replaceChildren(title);
          if (result.kind === 'text') fileView.append(recordText(result.content || '', 'file-content'));
          else {
            const messages = {
              binary: 'This is a binary file. A text preview is not available.',
              too_large: 'This file is too large to preview.',
              symlink: 'This is a symbolic link. Link targets are not opened.',
              other: 'A text preview is not available for this file type.'
            };
            fileView.append(element('p', 'context-status', messages[result.kind] || messages.other));
          }
          fileView.hidden = false;
          fileStatus.textContent = '';
          for (const button of fileList.querySelectorAll('button')) button.setAttribute('aria-pressed', String(button.dataset.path === path));
        } catch (problem) {
          if (disposed || version !== navigationVersion) return;
          fileStatus.textContent = '';
          showError(fileError, problem, () => loadFile(path));
        }
      }
      files.addEventListener('toggle', () => {
        if (files.open && !filesLoaded) loadDirectory();
      });
      loadContext();
      return {panels, dispose() { disposed = true; }};
    }
    function questionForm(question) {
      const form = element('form', 'question');
      form.dataset.state = question.state;
      const context = contextPanels(question);
      const legacy = question.question_type === 'multiple_choice';
      const kinds = {yes_no: 'Yes / no', single_choice: 'Single choice', open_ended: 'Open question', multiple_choice: 'Multiple choice (retired)'};
      form.append(element('p', 'type', kinds[question.question_type]));
      const fieldset = element('fieldset');
      fieldset.append(element('legend', null, question.question));
      const fields = element('div', 'fields');
      const help = element('p', 'help');
      help.id = `help-${question.state}`;
      fieldset.setAttribute('aria-describedby', help.id);
      fields.append(help);
      let textarea;
      const inputs = [];
      if (legacy) {
        help.textContent = 'This question uses a retired multiple-choice format. Start a new run to use single-choice questions.';
        const options = element('ol', 'legacy-options');
        for (const option of question.options) options.append(element('li', null, option));
        fields.append(options);
      } else if (question.question_type === 'open_ended') {
        help.textContent = 'Write your answer below.';
        textarea = element('textarea');
        textarea.setAttribute('aria-label', 'Your answer');
        textarea.required = true;
        fields.append(textarea);
      } else {
        const binary = question.question_type === 'yes_no';
        help.textContent = binary ? 'Choose one answer.' : 'Choose one answer. If none of the options fits, select None of the above.';
        const options = element('div', 'options' + (binary ? ' binary' : ''));
        const choices = binary ? ['Yes', 'No'] : [...question.options, 'None of the above'];
        choices.forEach((text, index) => {
          const label = element('label', 'option');
          const input = element('input');
          input.type = 'radio';
          input.name = `answer-${question.state}`;
          input.value = binary ? ['yes', 'no'][index]
            : index === question.options.length ? 'none_of_above' : String(index + 1);
          input.required = true;
          inputs.push(input);
          label.append(input, element('span', null, text));
          options.append(label);
        });
        fields.append(options);
      }
      fieldset.append(fields);
      form.append(fieldset);
      const actions = element('div', 'actions');
      const selection = element('span', 'selection');
      selection.setAttribute('aria-live', 'polite');
      const submit = element('button', 'primary', 'Submit answer');
      submit.type = 'submit';
      const unavailable = element('button', 'secondary', 'Unable to answer');
      unavailable.type = 'button';
      unavailable.dataset.action = 'unavailable';
      const buttons = element('div', 'answer-buttons');
      buttons.append(unavailable, submit);
      actions.append(selection, buttons);
      const error = element('p', 'error');
      error.setAttribute('role', 'alert');
      error.hidden = true;
      const unavailableHelp = legacy ? 'Recorded choices are shown for reference. This retired format cannot be answered.'
        : 'If you don’t know, choose Unable to answer. The agent will be told that no answer was available.';
      form.append(actions, element('p', 'unavailable-help', unavailableHelp), error, context.panels);
      let busy = false;
      let pendingUnavailable = false;
      function update() {
        const selected = inputs.filter(input => input.checked);
        const binary = question.question_type === 'yes_no';
        const valid = textarea ? textarea.value.trim().length > 0 : selected.length === 1;
        submit.disabled = busy || legacy || !valid;
        submit.textContent = busy && !pendingUnavailable ? 'Submitting…' : 'Submit answer';
        unavailable.disabled = busy || legacy;
        unavailable.textContent = busy && pendingUnavailable ? 'Submitting…' : 'Unable to answer';
        fieldset.disabled = busy || legacy;
        selection.textContent = legacy ? 'Read only' : textarea ? '' : binary
          ? (selected.length ? `${selected[0].value === 'yes' ? 'Yes' : 'No'} selected` : 'Choose yes or no')
          : selected.length ? (selected[0].value === 'none_of_above' ? 'None of the above selected' : `Option ${selected[0].value} selected`) : 'Choose one option';
      }
      form.addEventListener('input', update);
      form.addEventListener('change', update);
      form.addEventListener('submit', async event => {
        event.preventDefault();
        if (submit.disabled || busy) return;
        await sendReply(false);
      });
      unavailable.addEventListener('click', () => {
        if (!unavailable.disabled && !busy) sendReply(true);
      });
      async function sendReply(isUnavailable) {
        const selected = inputs.filter(input => input.checked);
        const answer = isUnavailable ? undefined : textarea ? textarea.value : selected[0].value;
        busy = true;
        pendingUnavailable = isUnavailable;
        submitting++;
        error.hidden = true;
        updateBusy();
        try {
          await api('/api/reply', isUnavailable ? {state: question.state, status: 'unavailable'} : {state: question.state, answer});
          answered.add(question.state);
          context.dispose();
          forms.delete(question.state);
          form.remove();
          updateCount();
          announce(isUnavailable ? 'Saved as unable to answer. The agent can continue.' : 'Answer submitted and saved.');
        } catch (problem) {
          error.textContent = problem.message;
          error.hidden = false;
        } finally {
          busy = false;
          submitting--;
          updateBusy();
          if (!submitting && pendingQuestions !== null) {
            const latest = pendingQuestions;
            pendingQuestions = null;
            applyQuestions(latest);
          }
        }
      }
      return {node: form, update, dispose: context.dispose};
    }
    function applyQuestions(incoming) {
      if (submitting) {
        pendingQuestions = incoming;
        return;
      }
      const waiting = new Set(incoming.map(question => question.state));
      for (const [state, form] of forms) {
        if (!waiting.has(state)) {
          form.dispose();
          form.node.remove();
          forms.delete(state);
        }
      }
      for (const question of incoming) {
        // Keep existing nodes in place: their answers, focus and disclosures belong
        // to the person. Newly observed questions join the end of the list.
        if (forms.has(question.state) || answered.has(question.state)) continue;
        const form = questionForm(question);
        forms.set(question.state, form);
        form.update();
        questions.append(form.node);
      }
      updateCount();
    }
    function showConnection(text) {
      if (connection.textContent !== text) connection.textContent = text;
    }
    function receiveEvent(block) {
      let type = 'message';
      const data = [];
      for (const line of block.split('\n')) {
        if (line.startsWith('event:')) type = line.slice(6).trim();
        if (line.startsWith('data:')) data.push(line.slice(5).trimStart());
      }
      if (!data.length) return;
      const value = JSON.parse(data.join('\n'));
      if (type === 'questions') {
        if (!Array.isArray(value.questions) || value.questions.some(question =>
          !question || !/^[0-9a-f]{64}$/.test(question.state) || typeof question.question !== 'string' ||
          !['yes_no', 'single_choice', 'open_ended', 'multiple_choice'].includes(question.question_type) ||
          !Array.isArray(question.options) || question.options.some(option => typeof option !== 'string'))) {
          throw new Error('Invalid question update.');
        }
        applyQuestions(value.questions);
        showConnection('Connected. New questions appear automatically.');
      } else if (type === 'unavailable') {
        showConnection('Waiting for Alaya. Updates will resume automatically.');
      }
    }
    async function renewToken(signal) {
      // A server restart rotates the page token. Read the same-origin page's
      // token without reloading this document or losing an unfinished answer.
      const response = await fetch('/', {cache: 'no-store', signal});
      if (!response.ok) throw new Error('Could not reconnect.');
      const page = new DOMParser().parseFromString(await response.text(), 'text/html');
      const next = page.querySelector('meta[name="alaya-token"]')?.content;
      if (!next) throw new Error('Could not reconnect.');
      token = next;
    }
    let watching = false;
    let watcher;
    let streamController;
    window.addEventListener('pagehide', () => {
      watching = false;
      streamController?.abort();
    });
    function startWatching() {
      watching = true;
      if (!watcher) watcher = watchQuestions().finally(() => {
        watcher = null;
        if (watching) startWatching();
      });
    }
    window.addEventListener('pageshow', startWatching);
    async function watchQuestions() {
      let retryDelay = 1000;
      while (watching) {
        const controller = new AbortController();
        streamController = controller;
        let timer;
        let reader;
        const keepAlive = () => {
          clearTimeout(timer);
          timer = setTimeout(() => controller.abort(), 35000);
        };
        try {
          keepAlive();
          const response = await fetch('/api/events', {
            headers: {'X-Alaya-Token': token}, cache: 'no-store', signal: controller.signal
          });
          if (response.status === 403) {
            await renewToken(controller.signal);
            throw new Error('Reconnecting with a new page token.');
          }
          if (!response.ok || !response.body ||
              !response.headers.get('Content-Type')?.startsWith('text/event-stream')) {
            throw new Error('Could not listen for questions.');
          }
          reader = response.body.getReader();
          const decoder = new TextDecoder();
          let buffer = '';
          while (watching) {
            const {value, done} = await reader.read();
            if (done) throw new Error('Connection closed.');
            keepAlive();
            buffer = (buffer + decoder.decode(value, {stream: true})).replace(/\r\n/g, '\n');
            let end;
            while ((end = buffer.indexOf('\n\n')) !== -1) {
              receiveEvent(buffer.slice(0, end));
              buffer = buffer.slice(end + 2);
              retryDelay = 1000;
            }
          }
        } catch (_) {
          if (watching) showConnection('Connection interrupted. Reconnecting automatically…');
        } finally {
          clearTimeout(timer);
          controller.abort();
          if (reader) await reader.cancel().catch(() => {});
        }
        if (watching) {
          await new Promise(resolve => setTimeout(resolve, retryDelay));
          retryDelay = Math.min(retryDelay * 2, 10000);
        }
      }
    }
    startWatching();
  </script>
</body>
